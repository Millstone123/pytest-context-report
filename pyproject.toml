[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-context-report"
version = "1.0.0"
description = "Compact pytest session context and timing reports"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pytest>=7.0"]

[project.entry-points.pytest11]
context_report = "pytest_context_report.plugin"

[tool.setuptools.packages.find]
include = ["pytest_context_report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
